<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK Kesari AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080d20;
 color:white;
 text-align:center;
 padding:20px;
}
.container{
 max-width:500px;
 margin:25px auto;
 background:#151f3c;
 padding:25px;
 border-radius:22px;
 box-shadow:0 0 25px #087cff55;
}
.logo{
 font-size:65px;
 margin:10px;
}
h1{color:#ffc928;font-size:30px}
.sub{color:#aab9dc}
.speaker{
 width:100px;height:100px;
 border-radius:50%;
 border:3px solid #ffc928;
 background:#142c59;
 color:white;
 font-size:45px;
 margin:20px;
}
.question{
 background:#26375f;
 padding:20px;
 border-radius:15px;
 font-size:20px;
 margin:15px 0;
}
.option{
 display:block;
 width:100%;
 padding:14px;
 margin:10px 0;
 border:1px solid #5575ad;
 border-radius:12px;
 background:#1b2c50;
 color:white;
 font-size:17px;
}
button{cursor:pointer}
.option:active{background:#245caa}
#result{color:#ffc928;font-size:19px}
.next{
 background:#ffbd20;
 color:#111;
 border:0;
 padding:15px 35px;
 border-radius:12px;
 font-size:18px;
 font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🤖</div>

<h1>GK KESARI AI</h1>
<p class="sub">SMART KNOWLEDGE DASHBOARD</p>

<button class="speaker" onclick="speakQuestion()">🔊</button>

<div class="question" id="question">
भारत की राजधानी क्या है?
</div>

<div id="options"></div>

<p id="result">अपना सही जवाब चुनिए</p>

<button class="next" onclick="nextQuestion()">
अगला सवाल ➜
</button>

<p class="sub">GK KESARI AI • LIVE DASHBOARD</p>

</div>

<script>

const questions=[
{
q:"भारत की राजधानी क्या है?",
o:["मुंबई","नई दिल्ली","जयपुर","पटना"],
a:1
},
{
q:"भारत का राष्ट्रीय पशु कौन है?",
o:["शेर","हाथी","बाघ","घोड़ा"],
a:2
},
{
q:"ताजमहल कहाँ स्थित है?",
o:["दिल्ली","आगरा","जयपुर","लखनऊ"],
a:1
},
{
q:"भारत का राष्ट्रीय पक्षी कौन है?",
o:["तोता","मोर","कबूतर","हंस"],
a:1
},
{
q:"भारत का संविधान कब लागू हुआ?",
o:["1947","1948","1950","1952"],
a:2
}
];

let current=0;
let answered=false;

function loadQuestion(){
 answered=false;
 let q=questions[current];
 document.getElementById("question").innerText=q.q;
 document.getElementById("result").innerText="अपना सही जवाब चुनिए";

 let html="";
 q.o.forEach((v,i)=>{
 html+=`<button class="option" onclick="checkAnswer(${i})">${v}</button>`;
 });
 document.getElementById("options").innerHTML=html;
}

function checkAnswer(i){
 if(answered)return;
 answered=true;

 let q=questions[current];
 if(i===q.a){
 document.getElementById("result").innerText="✅ बिल्कुल सही जवाब!";
 }else{
 document.getElementById("result").innerText=
 "❌ सही जवाब: "+q.o[q.a];
 }
}

function nextQuestion(){
 current=(current+1)%questions.length;
 loadQuestion();
}

function speakQuestion() {
  window.speechSynthesis.cancel();
  let text = questions[current].q;
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "hi-IN";
  window.speechSynthesis.speak(speech);
}
 speech.rate=0.9;
 speechSynthesis.cancel();
 speechSynthesis.speak(speech);
}

loadQuestion();

</script>
</body>
</html>
